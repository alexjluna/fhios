b24_user.settings_form:
  path: '/admin/config/b24/user'
  defaults:
    _title: 'Bitrix24 user settings'
    _form: 'Drupal\b24_user\Form\SettingsForm'
  requirements:
    _permission: 'administer b24 configuration'

b24_user.mapping_form:
  path: '/admin/config/b24/user/mapping'
  defaults:
    _form: '\Drupal\b24_user\Form\MappingForm'
    _title: 'Mapping Form'
  requirements:
    _permission: 'administer b24 configuration'
  options:
    _admin_route: TRUE


b24_user.user_export_batch_form:
  path: 'admin/config/b24/user/export_users'
  defaults:
    _form: '\Drupal\b24_user\Form\UserExportBatchForm'
    _title: 'Users Export'
  requirements:
    _permission: 'administer b24 configuration'

b24_user.user_import_batch_form:
  path: 'admin/config/b24/user/import_users'
  defaults:
    _form: '\Drupal\b24_user\Form\UserImportBatchForm'
    _title: 'Users Import'
  requirements:
    _permission: 'administer b24 configuration,administer users'


