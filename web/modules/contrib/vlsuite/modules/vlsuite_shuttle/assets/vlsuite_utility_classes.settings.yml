      'block_content:vlsuite_collection_stmt:vlsuite_image': 'block_content:vlsuite_collection_stmt:vlsuite_image'
      'block_content:vlsuite_collection_card:vlsuite_icon': 'block_content:vlsuite_collection_card:vlsuite_icon'
    values:
      bottom-left-translate-middle:
        visual_name: 'Bottom left translate middle'
        class_suffix: 'absolute bottom-0 start-0 translate-middle'
      top-center-translate-middle:
        visual_name: 'Top center translate middle'
        class_suffix: 'absolute top-0 start-50 translate-middle'
  width:
    apply_to:
      'block_content:vlsuite_collection_hero:vlsuite_link:item': 'block_content:vlsuite_collection_hero:vlsuite_link:item'
      'node:vlsuite_landing:field_vlsuite_landing_cta_link:item': 'node:vlsuite_landing:field_vlsuite_landing_cta_link:item'
