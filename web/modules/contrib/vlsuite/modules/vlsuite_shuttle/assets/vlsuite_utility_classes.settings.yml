    apply_to:
      'block_content:vlsuite_collection_hero:vlsuite_link:item': 'block_content:vlsuite_collection_hero:vlsuite_link:item'
      'block_content:vlsuite_collection_hero:vlsuite_media:item': 'block_content:vlsuite_collection_hero:vlsuite_media:item'
