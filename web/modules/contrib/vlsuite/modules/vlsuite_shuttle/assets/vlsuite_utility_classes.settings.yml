      'block_content:vlsuite_collection_card:vlsuite_link': 'block_content:vlsuite_collection_card:vlsuite_link'
  padding:
    apply_to:
      'block_content:vlsuite_collection_hero:vlsuite_link': 'block_content:vlsuite_collection_hero:vlsuite_link'
      'block_content:vlsuite_collection_hero:vlsuite_text': 'block_content:vlsuite_collection_hero:vlsuite_text'
