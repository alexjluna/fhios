      'block_content:vlsuite_collection_card:vlsuite_media:item': 'block_content:vlsuite_collection_card:vlsuite_media:item'
      'block_content:vlsuite_collection_gallery:vlsuite_medias:item': 'block_content:vlsuite_collection_gallery:vlsuite_medias:item'
    class_prefix: 'vlsuite-ratio vlsuite-ratio-'
  fit:
    icon: ''
    advanced: true
    apply_to:
      'block_content:vlsuite_collection_stmt:vlsuite_image:item': 'block_content:vlsuite_collection_stmt:vlsuite_image:item'
    visual_name: Fit
    class_prefix: position-
    values:
      parent:
        icon: ''
        visual_name: Parent
        class_suffix: 'absolute top-0 start-0 w-100 h-100'
