vlsuite_layout_builder.duplicate_block:
  path: '/layout_builder/duplicate/block/{section_storage_type}/{section_storage}/{delta}/{region}/{uuid}'
  defaults:
    _controller: '\Drupal\vlsuite_layout_builder\Controller\VLSuiteLayoutBuilderDuplicate::block'
  requirements:
    _layout_builder_access: 'view'
  options:
    _admin_route: TRUE
    parameters:
      section_storage:
        layout_builder_tempstore: TRUE
